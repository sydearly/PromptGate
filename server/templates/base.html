<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character Encoding -->
    <meta charset="UTF-8">

    <!-- Viewport for Mobile Responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page Title -->
    <title>PromptGate – Secure, Rate-Limited AI Interaction</title>

    <!-- Description for SEO -->
    <meta name="description"
          content="PromptGate is a secure, rate-limited AI interface prototype built with Google OAuth and OpenAI APIs. A vibecoding project by Syd Early.">

    <!-- Author -->
    <meta name="author" content="Syd Early">

    <!-- Theme Colors -->
    <meta name="theme-color" content="#ffffff">
    <meta name="background-color" content="#ffffff">

    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="PromptGate – Secure, Rate-Limited AI Interaction">
    <meta property="og:description"
          content="A vibecoding prototype integrating Google OAuth and OpenAI for responsible AI interaction.">
    <meta property="og:image" content="/android-chrome-512x512.png">
    <meta property="og:url" content="https://sydearly.blog/promptgate">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Optional: Keywords for indexing -->
    <meta name="keywords"
          content="PromptGate, OpenAI, OAuth, Flask, Vibecoding, AI, Prototype, Rate Limiting, Secure AI">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Favicons / Manifest -->
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <meta name="theme-color" content="#0f766e">

    {% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
